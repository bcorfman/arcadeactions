[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arcadeactions"
version = "0.11.0"
description = "Extension library for Arcade 3.x, providing a high-level way to animate sprites with conditional actions."
authors = [
    {name = "Brandon Corfman", email = "teacup_canny.5l@icloud.com"}
]
license = {file="LICENSE"}
readme = "README.md"
requires-python = ">= 3.10"
keywords = ["arcade", "gamedev", "animation", "actions", "sprites"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "arcade>=3.0.0.dev35",
    "pyglet>=2.1.dev5",
    # For fallback monitor detection
    "screeninfo>=0.8.1",
    # Optional; provides Python bindings and wheels for SDL2 on many platforms
    "PySDL2>=0.9.16",
    # For hot-reload file watching
    "watchdog>=5.0.0",
    # For YAML template export/import
    "PyYAML>=6.0",
    "plyer>=2.1.0",
]

[project.urls]
Homepage = "https://github.com/bcorfman/arcadeactions"
Repository = "https://github.com/bcorfman/arcadeactions"
Documentation = "https://deepwiki.com/bcorfman/arcadeactions"
Issues = "https://github.com/bcorfman/arcadeactions/issues"

[project.scripts]
create-action-level = "arcadeactions.dev.create_level:main"

[project.optional-dependencies]
statemachine = [
    "python-statemachine>=3.1.2",
]
statemachine_diagrams = [
    "python-statemachine[diagrams]>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=5.0.0",
    "diff-cover>=10.4.1",
    "libcst>=1.9.0",
    "build>=1.5.1",
    "ruff>=0.16.2",
    "uv>=0.12.3",
    "radon>=6.0.0",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:The Python dbus package is not installed\\..*:UserWarning:plyer\\.platforms\\.linux\\.notification",
]
markers=["unit: Unit tests.",
         "system: System tests.",
         "integration: Integration tests that require window/OpenGL context.",
         "slow: Slow tests that run only on request or in CI."]
         

[tool.ruff]
line-length = 120
fix = true
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.hatch.build.targets.wheel]
packages = ["arcadeactions"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
extend-fixable = ["E", "F", "UP", "B", "SIM", "I"]

# Enable flake8-tidy-imports rules (TID*) so that banned-api violations are enforced
extend-select = ["TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"builtins.isinstance".msg = "Avoid isinstance; design clear interfaces instead."
"builtins.hasattr".msg = "Avoid hasattr runtime checks; use explicit interfaces."
"builtins.getattr".msg = "Avoid getattr runtime checks; use explicit interfaces."

